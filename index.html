<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>用户研究：舞蹈生成视频主观评价</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px 28px;
      background: #f7f7f7;
      color: #222;
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    p {
      line-height: 1.6;
      text-align: center;
      margin-top: 0;
    }

    .trial-layout {
      display: flex;
      gap: 28px;
      align-items: flex-start;
      justify-content: center;
      margin-top: 24px;
      max-width: 1680px;
      margin-left: auto;
      margin-right: auto;
    }

    .trajectory-panel {
      flex: 0 0 260px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      padding: 12px;
    }

    .trajectory-label {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 8px;
      text-align: center;
      color: #2563eb;
    }

    .trajectory-image-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      background: #f0f0f0;
      border: 1px solid #ddd;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .trajectory-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .trajectory-status {
      font-size: 13px;
      color: #b45309;
      margin-top: 6px;
      text-align: center;
      min-height: 18px;
    }

    .scene-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, minmax(210px, 1fr));
      gap: 20px 22px;
      min-width: 0;
    }

    @media (max-width: 1400px) {
      .trial-layout {
        flex-direction: column;
        align-items: center;
      }

      .trajectory-panel {
        flex: 0 0 auto;
        width: min(260px, 100%);
      }

      .scene-grid {
        width: 100%;
        grid-template-columns: repeat(3, minmax(200px, 1fr));
      }
    }

    @media (max-width: 900px) {
      .scene-grid {
        grid-template-columns: repeat(2, minmax(180px, 1fr));
      }
    }

    .scene {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      padding: 12px 12px 16px;
    }

    .scene-title {
      font-weight: bold;
      margin-bottom: 6px;
      text-align: left;
    }

    .media-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      background: #000;
      overflow: hidden;
    }

    .scene video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    .rating-block {
      margin-top: 10px;
      font-size: 13px;
    }

    .rating-label {
      text-align: left;
      margin-bottom: 4px;
    }

    .rating-options {
      display: flex;
      gap: 8px;
    }

    .rating-options label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid #999;
      cursor: pointer;
      font-size: 13px;
      user-select: none;
      background: #fff;
      transition: all 0.15s ease-out;
    }

    .rating-options input {
      display: none;
    }

    .rating-options input:checked + span {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
      font-weight: bold;
    }

    .rating-options label.checked {
      background: #2563eb;
      border-color: #2563eb;
    }

    .rating-options label.checked span {
      color: #fff;
      font-weight: bold;
    }

    .video-status {
      font-size: 13px;
      color: #b45309;
      margin-top: 6px;
      text-align: center;
      min-height: 18px;
    }

    .buttons {
      margin-top: 26px;
      text-align: center;
    }

    .buttons button {
      margin: 4px 8px;
      padding: 10px 22px;
      border: none;
      border-radius: 6px;
      background-color: #007bff;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.15s ease-out;
    }

    .buttons button:hover {
      background-color: #005fcc;
    }

    .buttons button:disabled {
      background-color: #cccccc;
      color: #666666;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .buttons button:disabled:hover {
      background-color: #cccccc;
    }

    .buttons .backup-button {
      background-color: #64748b;
    }

    .buttons .backup-button:hover {
      background-color: #475569;
    }

    #status {
      margin-top: 10px;
      text-align: center;
      color: #16a34a;
      font-size: 14px;
    }

    #trialInfo {
      margin-top: 4px;
      text-align: center;
      font-size: 14px;
      color: #555;
    }

    #pageScene {
      font-size: 18px;
      font-weight: bold;
      color: #2563eb;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h2>用户研究：舞蹈生成视频主观评价</h2>
  <p>
    每一页展示同一场景下，5 种不同方法的生成结果，请观看后分别评分。<br>
    请对每个视频从两个维度进行 1–5 分评分<br>
    <b><span style="color:#d40303;">评分标准：</span> 1=很差，2=较差，3=一般，4=较好，5=很好</b><br>
    <b><span style="color:#d40303;">维度一：</span> 轨迹跟随情况</b>（生成动作是否准确跟随参考轨迹？）<br>
    <b><span style="color:#d40303;">维度二：</span> 舞蹈动作质量</b>（动作是否流畅自然、符合舞蹈表现？）
  </p>
  <p id="pageScene"></p>

  <div class="trial-layout">
    <div class="trajectory-panel">

      <div class="trajectory-image-wrap">

      <div class="rating-block">

    <div class="scene" data-scene-index="2">
      <div class="scene-title"></div>
      <div class="media-wrap"><video id="video-2" controls loop></video></div>
      <div class="video-status" id="status-2" aria-live="polite"></div>
      <div class="rating-block">
        <div class="rating-label">轨迹跟随情况</div>
        <div class="rating-options" data-type="trajectory"></div>

      <div class="rating-block">
        <div class="rating-label">舞蹈动作质量</div>

    <div class="scene" data-scene-index="3">

      <div class="media-wrap"><video id="video-3" controls loop></video></div>
      <div class="video-status" id="status-3" aria-live="polite"></div>
      <div class="rating-block">
        <div class="rating-label">轨迹跟随情况</div>
        <div class="rating-options" data-type="trajectory"></div>
      </div>
      <div class="rating-block">
        <div class="rating-label">舞蹈动作质量</div>
        <div class="rating-options" data-type="quality"></div>

    <div class="scene" data-scene-index="4">
      <div class="scene-title"></div>
      <div class="media-wrap"><video id="video-4" controls loop></video></div>
      <div class="video-status" id="status-4" aria-live="polite"></div>
      <div class="rating-block">
        <div class="rating-label">轨迹跟随情况</div>
        <div class="rating-options" data-type="trajectory"></div>
      </div>
      <div class="rating-block">

  <div class="buttons">
    <button id="prevButton" onclick="goToPrevious()">上一页</button>
    <button onclick="saveAndNext()">保存并下一页</button>
    <button id="submitButton" onclick="submitResults()">提交结果</button>
    <button id="exportButton" class="backup-button" onclick="exportCSV()">下载备份</button>
  </div>

  <p id="status"></p>
  <p id="trialInfo"></p>

  <script>
    // === 实验配置 ===
    // 5 种方法（参照 01/ 文件夹命名）
    const methodNames = ['ours', 'tcdiff', 'tcdiffpp', 'tcdiffstar', 'edge'];

    // 6 个场景文件夹（01～06），视频尚未全部就绪时会显示加载重试提示
    const sceneFolders = ['01', '02', '03', '04', '05', '06'];

    const METHOD_COUNT = methodNames.length;

    // 替换为 Google Apps Script 部署后得到的 /exec 地址。
    const SUBMIT_URL = 'https://script.google.com/macros/s/AKfycbxbR__-EyyHcE9JJt-99t3n57Qd3HDrV5F6gUwHwXHU9nT_YxPbenmO58iNzBe8k-bQ/exec';
    const PARTICIPANT_ID_KEY = 'userStudyParticipantId';
    const SUBMISSION_KEY = 'userStudySubmission';

    function createUuid() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }

      // 为不支持 crypto.randomUUID() 的旧浏览器提供兼容方案。
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, char => {
        const randomValue = window.crypto && window.crypto.getRandomValues
          ? window.crypto.getRandomValues(new Uint8Array(1))[0] % 16
          : Math.floor(Math.random() * 16);
        const value = char === 'x' ? randomValue : (randomValue & 0x3) | 0x8;
        return value.toString(16);
      });
    }

    let participantId = localStorage.getItem(PARTICIPANT_ID_KEY);
    if (!participantId) {
      participantId = createUuid();
      localStorage.setItem(PARTICIPANT_ID_KEY, participantId);
    }

    const trials = sceneFolders.map((folder, sceneIndex) => ({
      sceneName: folder,
      sceneIndex: sceneIndex,
      videos: methodNames.map(method => `${folder}/${method}.mp4`),
      methods: methodNames
    }));

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    const randomizedTrials = shuffle([...trials]);

    const flag_trial = false;

    let currentTrial = 0;
    let results = [];

    const statusEl = document.getElementById('status');
    const trialInfoEl = document.getElementById('trialInfo');
    const pageSceneEl = document.getElementById('pageScene');
    const sceneGrid = document.getElementById('sceneGrid');
    const videoEls = Array.from({ length: METHOD_COUNT }, (_, i) => document.getElementById('video-' + i));
    const submitButton = document.getElementById('submitButton');
    const exportButton = document.getElementById('exportButton');
    const trajectoryImage = document.getElementById('trajectoryImage');
    const trajectoryStatus = document.getElementById('trajectoryStatus');

    (function installBasicDevtoolsDeterrent() {
      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });

      document.addEventListener('keydown', function (e) {
        if (e.keyCode === 123) {
          e.preventDefault();
          return false;
        }
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'C' || e.key === 'c' || e.key === 'J' || e.key === 'j')) {
          e.preventDefault();
          return false;
        }
        if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
          e.preventDefault();
          return false;
        }
        if (e.ctrlKey && (e.key === 's' || e.key === 'S' || e.key === 'p' || e.key === 'P')) {
          e.preventDefault();
          return false;
        }
      }, false);
    })();

    function setupVideoRetry(v) {
      v.dataset.retryCount = 0;
      v.dataset.retryTimer = '';

      function clearRetryTimer() {
        if (v.dataset.retryTimer) {
          try { clearTimeout(Number(v.dataset.retryTimer)); } catch (e) {}
          v.dataset.retryTimer = '';
        }
      }

      v.addEventListener('error', () => {
        v.dataset.retryCount = Number(v.dataset.retryCount || 0) + 1;
        const count = Number(v.dataset.retryCount);
        const delay = Math.min(Math.round(2000 * Math.pow(1.5, count - 1)), 30000);

        const name = v.dataset && v.dataset.filename ? v.dataset.filename : v.id;
        const videoIndex = v.id.replace('video-', '');
        const statusElForVideo = document.getElementById(`status-${videoIndex}`);
        if (statusElForVideo) {
          statusElForVideo.textContent = `⚠️ 视频 "${name}" 尚未就绪或加载失败，正在重试（第 ${count} 次，间隔 ${Math.round(delay / 1000)}s）...`;
        }

        clearRetryTimer();
        const t = setTimeout(() => {
          try {
            const src = v.getAttribute('src') || v.currentSrc || v.src;
            if (src) {
              v.src = '';
              void v.offsetWidth;
              v.src = src;
              v.load();
            }
          } catch (e) {}
        }, delay);
        v.dataset.retryTimer = String(t);
      });

      v.addEventListener('loadeddata', () => {
        clearRetryTimer();
        v.dataset.retryCount = 0;
        const videoIndex = v.id.replace('video-', '');
        const statusElForVideo = document.getElementById(`status-${videoIndex}`);
        if (statusElForVideo) {
          statusElForVideo.textContent = '';
        }
      });
    }

    videoEls.forEach(v => setupVideoRetry(v));

    function setupTrajectoryImage() {
      trajectoryImage.dataset.retryCount = 0;
      trajectoryImage.dataset.retryTimer = '';

      function clearRetryTimer() {
        if (trajectoryImage.dataset.retryTimer) {
          try { clearTimeout(Number(trajectoryImage.dataset.retryTimer)); } catch (e) {}
          trajectoryImage.dataset.retryTimer = '';
        }
      }

      trajectoryImage.addEventListener('load', () => {
        clearRetryTimer();
        trajectoryImage.dataset.retryCount = 0;
        trajectoryStatus.textContent = '';
      });

      trajectoryImage.addEventListener('error', () => {
        trajectoryImage.dataset.retryCount = Number(trajectoryImage.dataset.retryCount || 0) + 1;
        const count = Number(trajectoryImage.dataset.retryCount);
        const delay = Math.min(Math.round(2000 * Math.pow(1.5, count - 1)), 30000);
        const name = trajectoryImage.dataset.filename || 'trajectory.png';
        trajectoryStatus.textContent = `⚠️ 轨迹图 "${name}" 尚未就绪或加载失败，正在重试（第 ${count} 次，间隔 ${Math.round(delay / 1000)}s）...`;

        clearRetryTimer();
        const t = setTimeout(() => {
          const src = trajectoryImage.getAttribute('src');
          if (src) {
            trajectoryImage.src = '';
            void trajectoryImage.offsetWidth;
            trajectoryImage.src = src;
          }
        }, delay);
        trajectoryImage.dataset.retryTimer = String(t);
      });
    }

    setupTrajectoryImage();

    function loadTrajectoryImage(folder) {
      const src = `${folder}/trajectory.png`;
      trajectoryImage.dataset.filename = src;
      trajectoryStatus.textContent = '';
      trajectoryImage.src = src;
    }

    function clearTrajectoryImage() {
      trajectoryImage.removeAttribute('src');
      trajectoryImage.dataset.filename = '';
      trajectoryStatus.textContent = '';
    }

    videoEls.forEach(v => {
      v.addEventListener('play', () => {
        videoEls.forEach(x => {
          if (x !== v && x.src) {
            x.play().catch(() => {});
          }
        });
      });
    });

    function autoPlayAllVideos() {
      const loadPromises = videoEls
        .filter(v => v.src)
        .map(video => new Promise((resolve) => {
          if (video.readyState >= 2) {
            resolve();
            return;
          }
          const onCanPlay = () => {
            video.removeEventListener('canplay', onCanPlay);
            resolve();
          };
          video.addEventListener('canplay', onCanPlay);
          const onError = () => {
            video.removeEventListener('error', onError);
            resolve();
          };
          video.addEventListener('error', onError);
        }));

      Promise.all(loadPromises).then(() => {
        videoEls.forEach(video => {
          if (video.src) {
            video.play().catch(() => {});
          }
        });
      });
    }

    function updateRatingStyles(block) {
      const labels = block.querySelectorAll('label');
      labels.forEach(label => {
        const input = label.querySelector('input');
        if (input && input.checked) {
          label.classList.add('checked');
        } else {
          label.classList.remove('checked');
        }
      });
    }

    function initRatingControls() {
      const scenes = sceneGrid.querySelectorAll('.scene');
      scenes.forEach(scene => {
        const sceneIndex = Number(scene.dataset.sceneIndex);
        const ratingBlocks = scene.querySelectorAll('.rating-options');
        ratingBlocks.forEach(block => {
          const type = block.dataset.type;
          block.innerHTML = '';
          for (let score = 1; score <= 5; score++) {
            const id = `t${currentTrial}_s${sceneIndex}_${type}_${score}`;
            const name = `t${currentTrial}_s${sceneIndex}_${type}`;

            const label = document.createElement('label');
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = name;
            input.value = String(score);
            input.id = id;

            input.addEventListener('change', () => {
              updateRatingStyles(block);
            });

            const span = document.createElement('span');
            span.textContent = String(score);

            label.appendChild(input);
            label.appendChild(span);
            block.appendChild(label);
          }
        });
      });
    }

    function loadTrial() {
      if (currentTrial >= randomizedTrials.length) {
        statusEl.textContent = '✅ 所有页已完成，可以提交结果或下载备份。';
        trialInfoEl.textContent = '';
        pageSceneEl.textContent = '';
        clearTrajectoryImage();
        videoEls.forEach(v => v.removeAttribute('src'));
        for (let i = 0; i < METHOD_COUNT; i++) {
          const statusElForVideo = document.getElementById(`status-${i}`);
          if (statusElForVideo) statusElForVideo.textContent = '';
        }
        updateActionButtons();
        return;
      }

      const t = randomizedTrials[currentTrial];
      pageSceneEl.textContent = `当前场景：${t.sceneName}`;
      loadTrajectoryImage(t.sceneName);

      const videoMethodPairs = t.videos.map((videoSrc, idx) => ({
        videoSrc: videoSrc,
        method: t.methods[idx],
        filename: videoSrc.split('/').pop().replace('.mp4', '')
      }));
      // 同一页面返回重看时保持原有方法顺序，避免评分与方法错位。
      if (!t.shuffledPairs) {
        t.shuffledPairs = shuffle([...videoMethodPairs]);
      }
      const shuffledPairs = t.shuffledPairs;

      t.shuffledOrder = shuffledPairs.map((pair, idx) => ({
        displayIndex: idx + 1,
        method: pair.method,
        filename: pair.filename
      }));

      videoEls.forEach((video, index) => {
        const pair = shuffledPairs[index];
        video.src = pair.videoSrc;
        video.loop = true;
        video.dataset.method = pair.method;
        video.dataset.filename = pair.filename;
        video.dataset.displayIndex = index + 1;

        const scene = sceneGrid.querySelector(`[data-scene-index="${index}"]`);
        if (scene) {
          const titleEl = scene.querySelector('.scene-title');
          if (titleEl) {
            titleEl.textContent = '';
          }
        }

        const statusElForVideo = document.getElementById(`status-${index}`);
        if (statusElForVideo) statusElForVideo.textContent = '';
      });

      autoPlayAllVideos();
      initRatingControls();
      restoreRatings();
      updatePrevButton();
      updateActionButtons();

      statusEl.textContent = '';
      trialInfoEl.textContent = `页 ${currentTrial + 1} / ${randomizedTrials.length}`;
    }

    function restoreRatings() {
      const t = randomizedTrials[currentTrial];
      const savedResult = results.find(r => r.sceneName === t.sceneName && r.sceneIndex === t.sceneIndex);

      if (savedResult) {
        savedResult.ratings.forEach(rating => {
          const sceneIndex = rating.displayIndex - 1;
          const scene = sceneGrid.querySelector(`[data-scene-index="${sceneIndex}"]`);

          if (scene) {
            const trajectoryInput = scene.querySelector(`input[name*="_trajectory"][value="${rating.trajectory}"]`);
            if (trajectoryInput) {
              trajectoryInput.checked = true;
              trajectoryInput.dispatchEvent(new Event('change'));
            }

            const qualityInput = scene.querySelector(`input[name*="_quality"][value="${rating.quality}"]`);
            if (qualityInput) {
              qualityInput.checked = true;
              qualityInput.dispatchEvent(new Event('change'));
            }
          }
        });
      }
    }

    function updatePrevButton() {
      const prevButton = document.getElementById('prevButton');
      if (prevButton) {
        prevButton.disabled = currentTrial === 0;
        prevButton.style.opacity = currentTrial === 0 ? '0.5' : '1';
        prevButton.style.cursor = currentTrial === 0 ? 'not-allowed' : 'pointer';
      }
    }

    function goToPrevious() {
      if (currentTrial === 0) return;
      saveCurrentPage();
      currentTrial--;
      loadTrial();
    }

    function collectRatings() {
      const scenes = sceneGrid.querySelectorAll('.scene');
      let allRated = true;
      const ratings = [];

      scenes.forEach((scene, sceneIndex) => {
        const trajectoryInput = scene.querySelector('input[name*="_trajectory"]:checked');
        const qualityInput = scene.querySelector('input[name*="_quality"]:checked');

        if (!trajectoryInput || !qualityInput) {
          allRated = false;
        } else {
          const video = videoEls[sceneIndex];
          ratings.push({
            displayIndex: sceneIndex + 1,
            method: video.dataset.method,
            filename: video.dataset.filename,
            trajectory: trajectoryInput.value,
            quality: qualityInput.value
          });
        }
      });

      return { allRated, ratings };
    }

    function saveCurrentPage() {
      const t = randomizedTrials[currentTrial];
      const { allRated, ratings } = collectRatings();

      if (allRated) {
        const existingIndex = results.findIndex(r => r.sceneName === t.sceneName && r.sceneIndex === t.sceneIndex);
        const resultData = {
          pageOrder: currentTrial + 1,
          sceneName: t.sceneName,
          sceneIndex: t.sceneIndex,
          ratings: ratings,
          timestamp: new Date().toISOString()
        };

        if (existingIndex >= 0) {
          results[existingIndex] = resultData;
        } else {
          results.push(resultData);
        }
      }
    }

    function areAllScenesCompleted() {
      const allScenesCompleted = sceneFolders.every(folder => {
        return results.some(r => r.sceneName === folder);
      });

      return flag_trial || allScenesCompleted;
    }

    function updateActionButtons() {
      const allScenesCompleted = areAllScenesCompleted();
      const savedSubmission = localStorage.getItem(SUBMISSION_KEY);

      submitButton.disabled = !allScenesCompleted || Boolean(savedSubmission);
      exportButton.disabled = !allScenesCompleted;
    }

    function saveAndNext() {
      const t = randomizedTrials[currentTrial];
      const { allRated, ratings } = collectRatings();

      if (!allRated) {
        alert('⚠️ 请为所有视频完成评分后再继续。');
        return;
      }

      const existingIndex = results.findIndex(r => r.sceneName === t.sceneName && r.sceneIndex === t.sceneIndex);
      const resultData = {
        pageOrder: currentTrial + 1,
        sceneName: t.sceneName,
        sceneIndex: t.sceneIndex,
        ratings: ratings,
        timestamp: new Date().toISOString()
      };

      if (existingIndex >= 0) {
        results[existingIndex] = resultData;
      } else {
        results.push(resultData);
      }

      updateActionButtons();
      currentTrial++;
      loadTrial();
    }

    async function submitResults() {
      if (!areAllScenesCompleted()) {
        alert('请完成所有场景的评分后再提交。');
        return;
      }

      if (!SUBMIT_URL.startsWith('https://script.google.com/macros/s/') || !SUBMIT_URL.endsWith('/exec')) {
        alert('提交地址尚未配置，请先设置 Apps Script /exec 地址。');
        return;
      }

      const allRows = [];
      results.forEach(result => {
        result.ratings.forEach(rating => {
          allRows.push({
            scene: result.sceneName,
            method: rating.method,
            trajectory: rating.trajectory,
            quality: rating.quality,
            timestamp: result.timestamp
          });
        });
      });

      const submissionId = createUuid();
      const payload = {
        participantId,
        submissionId,
        rows: allRows
      };

      submitButton.disabled = true;
      statusEl.textContent = '正在提交，请稍候…';

      try {
        await fetch(SUBMIT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        localStorage.setItem(
          SUBMISSION_KEY,
          JSON.stringify({
            submissionId,
            submittedAt: new Date().toISOString()
          })
        );

        // no-cors 无法读取服务器响应，因此这里只能确认请求已由浏览器发出。
        statusEl.textContent = '✅ 提交请求已发送，感谢参与。建议保留下载备份。';
        updateActionButtons();
      } catch (error) {
        console.error(error);
        statusEl.textContent = '⚠️ 提交失败，请重试或下载备份文件。';
        submitButton.disabled = false;
        exportButton.disabled = false;
      }
    }

    function exportCSV() {
      if (results.length === 0) {
        alert('没有可导出的结果。');
        return;
      }

      const escapeCSV = (value) => {
        if (value === null || value === undefined) return '';
        const str = String(value);
        if (str.includes(',') || str.includes('"') || str.includes('\n')) {
          return '"' + str.replace(/"/g, '""') + '"';
        }
        return str;
      };

      const allRows = [];
      results.forEach(r => {
        r.ratings.forEach(rating => {
          allRows.push({
            participantId,
            sceneName: r.sceneName,
            method: rating.method,
            trajectory: rating.trajectory,
            quality: rating.quality,
            timestamp: r.timestamp
          });
        });
      });

      allRows.sort((a, b) => {
        if (a.sceneName !== b.sceneName) {
          return a.sceneName.localeCompare(b.sceneName);
        }
        return a.method.localeCompare(b.method);
      });

      const csvRows = [];
      csvRows.push('participant_id,scene,method,trajectory following,dance quality,timestamp');
      allRows.forEach(row => {
        csvRows.push([
          escapeCSV(row.participantId),
          escapeCSV(row.sceneName),
          escapeCSV(row.method),
          escapeCSV(row.trajectory),
          escapeCSV(row.quality),
          escapeCSV(row.timestamp)
        ].join(','));
      });

      const csv = csvRows.join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `用户研究结果_${Date.now()}.csv`;
      a.click();
    }

    updatePrevButton();
    updateActionButtons();
    loadTrial();
  </script>

</body>
</html>
